server {
    listen 80;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video generation routinely takes 1.5-3+ minutes — nginx's 60s
        # default proxy_read_timeout was killing the client connection
        # mid-generation (even though the backend kept working), which made
        # the user retry and triggered a second, colliding generation for
        # the same video. Match the backend's own 5-minute abort timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Serve generated videos directly from disk instead of proxying to the
    # Python service's StaticFiles route — nginx's static-file byte-range
    # handling is far more robust under real (non-loopback) network latency
    # than Starlette's, which was leaving <video> stuck in a permanent
    # MEDIA_ERR_SRC_NOT_SUPPORTED state even though the file itself was fine.
    location /videos/ {
        alias /videos-data/;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
