server {
    listen 80;
    listen [::]:80;
    server_name gemaapp.site www.gemaapp.site;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9074;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # La generación de video con IA toma 1.5-3+ minutos — sin esto, esta
        # capa de nginx (host) cortaría la conexión a los 60s por defecto,
        # el mismo problema que tuvimos con el límite de proxy de Cloudflare.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
